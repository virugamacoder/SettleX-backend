# ─────────────────────────────────────────────────────────────────────────────
#  SettleX Backend — Docker Compose Override (Local Development)
#  Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
#  Differences from production:
#   - Builds the image locally instead of pulling from Docker Hub
#   - Mounts source code for hot-reload with nodemon
#   - Uses self-signed SSL certs from nginx/certs/ (generated by generate-local-certs.sh)
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: settlex-backend:local
    # container_name: settlex-app-local
    volumes:
      - ./src:/app/src:ro        # hot source reload
      - ./uploads:/app/uploads   # local uploads folder
    command: ["node", "src/index.js"]
    environment:
      - NODE_ENV=development

  nginx:
    # container_name: settlex-nginx-local
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro  # self-signed certs for local
