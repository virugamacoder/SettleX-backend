# ─────────────────────────────────────────────────────────────────────────────
#  SettleX Backend — Docker Compose (Production)
#  Usage on EC2: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Node.js Application ──────────────────────────────────────────────────
  app:
    image: ${DOCKER_IMAGE:-settlex-backend:latest}
    container_name: settlex-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      - uploads:/app/uploads
    networks:
      - settlex-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: settlex-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - uploads:/var/www/uploads:ro
    networks:
      - settlex-net
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  uploads:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  settlex-net:
    driver: bridge
