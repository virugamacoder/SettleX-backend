# ─────────────────────────────────────────────────────────────────────────────
#  SettleX Backend — GitHub Actions CI/CD
#
#  Trigger : push to `main` branch
#  Flow    : Build Docker image → Push to Docker Hub → SSH deploy to AWS EC2
#
#  Required GitHub Secrets (Settings → Secrets → Actions):
#    DOCKER_HUB_USERNAME        Docker Hub username
#    DOCKER_HUB_TOKEN           Docker Hub access token
#    SERVER_HOST                EC2 public IP (e.g. 16.171.146.88)
#    SERVER_USER                EC2 SSH user (e.g. ubuntu)
#    SERVER_SSH_KEY             Full content of EC2 private key (.pem)
#    SERVER_PORT                SSH port (usually 22)
#    APP_DIR                    Deploy path on EC2 (e.g. /home/ubuntu/settlex)
#    NODE_ENV                   production
#    PORT                       3000
#    BASE_URL                   http://EC2_IP  (use http:// for IP-only deployments)
#    MONGODB_URL                MongoDB Atlas connection string
#    JWT_SECRET                 JWT secret key
#    JWT_ACCESS_EXPIRATION_MINUTES   30
#    JWT_REFRESH_EXPIRATION_DAYS     30
#    COINMARKET_CAP_API_KEY     CoinMarketCap API key
#
#  NOTE: SSL certs are auto-generated in CI for SERVER_HOST IP — no manual cert secrets needed.
#  API is served on HTTP port 80 (no browser cert errors).
#  Port 443 uses an auto-generated self-signed cert (for HTTPS if needed).
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy SettleX Backend

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/settlex-backend

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build & Push Docker Image to Docker Hub
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract Docker Metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to AWS EC2 via SSH
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Step 1: Write .env file on server ─────────────────────────────────
      # NOTE: We write each line with printf to avoid YAML indentation
      #       contaminating values inside a heredoc.
      - name: Write .env to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR }}"
            mkdir -p "$APP_DIR"
            ENV_FILE="$APP_DIR/.env"

            echo "──── Writing .env ────"
            # Write using printf per-line — immune to YAML indentation
            printf 'NODE_ENV=%s\n'                        '${{ secrets.NODE_ENV }}'                        > "$ENV_FILE"
            printf 'PORT=%s\n'                            '${{ secrets.PORT }}'                            >> "$ENV_FILE"
            printf 'BASE_URL=%s\n'                        '${{ secrets.BASE_URL }}'                        >> "$ENV_FILE"
            printf 'MONGODB_URL=%s\n'                     '${{ secrets.MONGODB_URL }}'                     >> "$ENV_FILE"
            printf 'JWT_SECRET=%s\n'                      '${{ secrets.JWT_SECRET }}'                      >> "$ENV_FILE"
            printf 'JWT_ACCESS_EXPIRATION_MINUTES=%s\n'   '${{ secrets.JWT_ACCESS_EXPIRATION_MINUTES }}'   >> "$ENV_FILE"
            printf 'JWT_REFRESH_EXPIRATION_DAYS=%s\n'     '${{ secrets.JWT_REFRESH_EXPIRATION_DAYS }}'     >> "$ENV_FILE"
            printf 'COINMARKET_CAP_API_KEY=%s\n'          '${{ secrets.COINMARKET_CAP_API_KEY }}'          >> "$ENV_FILE"
            printf 'DOCKER_IMAGE=%s\n'                    '${{ secrets.DOCKER_HUB_USERNAME }}/settlex-backend:latest' >> "$ENV_FILE"
            echo "[✓] .env written"
            echo "[✓] .env contents (keys only):"
            cut -d= -f1 "$ENV_FILE"

      # ── Step 2: Auto-generate SSL certificate for SERVER_HOST IP ──────────
      # Self-signed cert with SAN matching the actual EC2 IP.
      # This runs entirely on the server — no cert secrets needed in GitHub.
      - name: Generate SSL Certificate on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            SERVER_IP="${{ secrets.SERVER_HOST }}"
            CERT_DIR="${{ secrets.APP_DIR }}/nginx/certs"
            mkdir -p "$CERT_DIR"

            # Only regenerate if cert is missing, expired (<7 days), or IP changed
            REGEN=false
            if [[ ! -f "$CERT_DIR/cert.pem" ]]; then
              echo "[cert] No cert found — generating..."
              REGEN=true
            elif ! openssl x509 -checkend 604800 -noout -in "$CERT_DIR/cert.pem" 2>/dev/null; then
              echo "[cert] Cert expires within 7 days — regenerating..."
              REGEN=true
            elif ! openssl x509 -noout -text -in "$CERT_DIR/cert.pem" 2>/dev/null | grep -q "$SERVER_IP"; then
              echo "[cert] Cert does not match current IP ($SERVER_IP) — regenerating..."
              REGEN=true
            else
              echo "[cert] Cert is valid and matches $SERVER_IP — skipping generation"
            fi

            if [[ "$REGEN" == "true" ]]; then
              openssl req -x509 \
                -newkey rsa:4096 \
                -nodes \
                -keyout "$CERT_DIR/private.key" \
                -out    "$CERT_DIR/cert.pem" \
                -days 365 \
                -subj "/C=IN/ST=Gujarat/L=AWS/O=SettleX/CN=$SERVER_IP" \
                -addext "subjectAltName=IP:$SERVER_IP,IP:127.0.0.1,DNS:localhost"
              chmod 600 "$CERT_DIR/private.key"
              chmod 644 "$CERT_DIR/cert.pem"
              echo "[✓] SSL certificate generated for IP: $SERVER_IP"
            fi

      # ── Step 3: Copy docker-compose + nginx config to server ──────────────
      - name: Copy Compose & Nginx Config to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml,nginx/nginx.conf"
          target: ${{ secrets.APP_DIR }}
          strip_components: 0

      # ── Step 4: Pull image and restart containers ──────────────────────────
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR }}"
            cd "$APP_DIR"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  SettleX Backend — Starting Docker Deployment  "
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Log in to Docker Hub on server
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            # Pull latest image
            echo "[1/3] Pulling latest image..."
            docker compose pull app

            # Restart containers (zero-downtime: new container starts before old stops)
            echo "[2/3] Restarting containers..."
            docker compose up -d --remove-orphans

            # Clean up old/dangling images
            echo "[3/3] Pruning old images..."
            docker image prune -f

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ✓ Deployment Complete!"
            echo "  Container status:"
            docker compose ps
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── Step 5: Verify deployment health ──────────────────────────────────
      - name: Verify Deployment Health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR }}"
            cd "$APP_DIR"

            echo "Waiting for app to be healthy..."
            for i in $(seq 1 12); do
              # Check via nginx port 80 (port 3000 is internal Docker only, not mapped to host)
              # Use grep on response body — avoids GitHub secret masking on HTTP status codes
              RESP=$(curl -s --max-time 5 http://127.0.0.1/health 2>/dev/null || echo "")
              if echo "$RESP" | grep -q '"status":"ok"'; then
                echo "  Attempt $i/12 — PASSED"
                echo "[✓] Health check passed — app is live!"
                docker compose ps
                exit 0
              else
                echo "  Attempt $i/12 — waiting... ($RESP)"
              fi
              sleep 5
            done
            echo "[!] Health check failed after 60s"
            docker compose logs --tail=50 app
            exit 1
