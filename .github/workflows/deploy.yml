name: Deploy SettleX Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code (just for validation, not needed on server) ──
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. SSH into server and deploy ────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  SettleX Backend — Starting Deploy  "
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Navigate to project directory
            cd ${{ secrets.APP_DIR }}

            # Pull latest changes
            echo "[1/4] Pulling latest code from main..."
            git pull origin main

            # Install dependencies (only production)
            echo "[2/4] Installing dependencies..."
            npm install --omit=dev

            # Reload or start with PM2
            echo "[3/4] Restarting app with PM2..."
            pm2 describe app > /dev/null 2>&1 \
              && pm2 reload ecosystem.config.json --update-env \
              || pm2 start ecosystem.config.json

            # Save PM2 process list
            echo "[4/4] Saving PM2 process list..."
            pm2 save

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ✓ Deployment Complete!             "
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
