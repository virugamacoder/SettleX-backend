# ─────────────────────────────────────────────────────────────────────────────
#  SettleX Backend — Nginx Configuration
#  Reverse proxy: HTTP → HTTPS redirect, HTTPS → app:3000
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP: redirect all to HTTPS ───────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # ACME challenge for Let's Encrypt (future use)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # All other traffic → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: proxy to Node.js app ───────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ── SSL Certificates ─────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/private.key;

    # ── SSL Hardening ────────────────────────────────────────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # ── Request size limit ───────────────────────────────────────────────────
    client_max_body_size 20M;

    # ── Proxy to Node.js ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ── Serve uploaded files directly via Nginx ───────────────────────────────
    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check endpoint (no proxy) ─────────────────────────────────────
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
